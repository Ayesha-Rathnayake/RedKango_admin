<div class="min-h-screen flex items-center justify-center bg-gray-900 px-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 sm:p-10">

    <!-- Logo -->
    <div class="text-center mb-8">
      <img
        src="red-kango-logo-navbar.png"
        alt="Red Kango Logo"
        class="h-16 sm:h-20 mx-auto object-contain"
      />
    </div>

    <div class="space-y-5">

      <!-- Email -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input
          type="email"
          [(ngModel)]="email"
          placeholder="admin@redkango.com"
          (keydown)="onKeyDown($event)"
          [disabled]="loading"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg
                 focus:outline-none focus:ring-2 focus:ring-green-500
                 text-sm disabled:bg-gray-100"
        />
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <div class="relative">
          <input
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            placeholder="••••••••"
            (keydown)="onKeyDown($event)"
            [disabled]="loading"
            class="w-full px-4 py-3 pr-11 border border-gray-300 rounded-lg
                   focus:outline-none focus:ring-2 focus:ring-green-500
                   text-sm disabled:bg-gray-100"
          />
          <button
            type="button"
            (click)="showPassword = !showPassword"
            class="absolute inset-y-0 right-0 w-11 flex items-center justify-center
                   text-gray-400 hover:text-green-600 transition">
            <i class="fas" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
        </div>
      </div>

      <!-- Error message -->
      <p *ngIf="errorMessage"
         class="flex items-center gap-2 text-red-600 text-sm bg-red-50
                border border-red-200 rounded-lg px-3 py-2">
        <i class="fas fa-circle-exclamation text-xs"></i>
        {{ errorMessage }}
      </p>

      <!-- Submit button -->
      <button
        (click)="onLogin()"
        [disabled]="loading"
        class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold
               py-3 rounded-lg transition-all duration-200 disabled:opacity-50
               disabled:cursor-not-allowed flex items-center justify-center gap-2">
        <svg *ngIf="loading" class="animate-spin h-4 w-4"
             fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10"
                  stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
        </svg>
        {{ loading ? 'Signing in…' : 'Sign In' }}
      </button>

    </div>
  </div>
</div>
